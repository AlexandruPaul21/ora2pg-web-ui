services:
  # -------------------------------------------------------
  # 1. Your Application (Backend + Frontend + Ora2Pg)
  # -------------------------------------------------------
  app:
    build: .
    container_name: ora2pg-app
    ports:
      - "8080:8080"
    volumes:
      - ora2pg-data:/data/projects
    depends_on:
      oracle:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - migration-net

  # -------------------------------------------------------
  # 2. Source Database: Oracle XE (Lightweight version)
  # -------------------------------------------------------
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: oracle-source
    environment:
      - ORACLE_PASSWORD=SecretPassword123
      - APP_USER=testuser
      - APP_USER_PASSWORD=testuser123
    ports:
      - "8000:1521"
    volumes:
      - ./docker-libs/init-oracle.sh:/container-entrypoint-startdb.d/init-oracle.sh
    networks:
      - migration-net
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/SecretPassword123@//localhost:1521/XE", "SELECT 1 FROM DUAL"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------
  # 3. Destination Database: PostgreSQL 16
  # -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "8001:5432"
    networks:
      - migration-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-libs/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql

volumes:
  ora2pg-data:
  postgres-data:

networks:
  migration-net:
