<p-toast></p-toast>

<div class="card p-4">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2 class="m-0">Ora2Pg Projects</h2>
    <p-button label="New Project" icon="pi pi-plus" (onClick)="openNew()"></p-button>
  </div>

  <p-table [value]="projects" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>Project Name</th>
        <th>Oracle Source</th>
        <th>Postgres Dest</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-project>
      <tr>
        <td>{{project.name}}</td>
        <td>{{project.oracleHost}}:{{project.oraclePort}}/{{project.oracleSid}}</td>
        <td>{{project.postgresHost}}:{{project.postgresPort}}/{{project.postgresDb}}</td>
        <td>
          <p-button icon="pi pi-play" styleClass="p-button-rounded p-button-success mr-2"></p-button>
          <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-danger"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="New Project Details" [(visible)]="displayDialog" [style]="{width: '450px'}" [modal]="true">
  <div class="flex flex-column gap-3 pt-3">

    <div class="field">
      <label for="name" class="block mb-2">Project Name</label>
      <input pInputText id="name" [(ngModel)]="newProject.name" class="w-full" />
    </div>

    <div class="formgrid grid">
      <div class="field col">
        <label class="block mb-2">Oracle Host</label>
        <input pInputText [(ngModel)]="newProject.oracleHost" class="w-full"/>
      </div>
      <div class="field col">
        <label class="block mb-2">Port</label>
        <input pInputText type="number" [(ngModel)]="newProject.oraclePort" class="w-full"/>
      </div>
    </div>

    <div class="field">
      <label class="block mb-2">Oracle Password</label>
      <div class="p-inputgroup">
        <p-password [(ngModel)]="newProject.oraclePassword" [toggleMask]="true" [feedback]="false"></p-password>
        <button type="button" pButton icon="pi pi-wifi" class="p-button-warning ml-1" (click)="testOracle()" pTooltip="Test Connection"></button>
      </div>
    </div>

    <p-divider></p-divider>

    <div class="formgrid grid">
      <div class="field col">
        <label class="block mb-2">Postgres Host</label>
        <input pInputText [(ngModel)]="newProject.postgresHost" class="w-full"/>
      </div>
      <div class="field col">
        <label class="block mb-2">Port</label>
        <input pInputText type="number" [(ngModel)]="newProject.postgresPort" class="w-full"/>
      </div>
    </div>

    <div class="field">
      <label class="block mb-2">Postgres Password</label>
      <div class="p-inputgroup">
        <p-password [(ngModel)]="newProject.postgresPassword" [toggleMask]="true" [feedback]="false"></p-password>
        <button type="button" pButton icon="pi pi-wifi" class="p-button-warning ml-1" (click)="testPostgres()" pTooltip="Test Connection"></button>
      </div>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancel" icon="pi pi-times" (onClick)="displayDialog=false" styleClass="p-button-text"></p-button>
    <p-button label="Save" icon="pi pi-check" (onClick)="saveProject()"></p-button>
  </ng-template>
</p-dialog>
